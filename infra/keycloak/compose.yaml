name: keycloak

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    # --import-realm importa ./import/*-realm.json solo si el realm no existe.
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Marcadores ${VAR} de import/lab-realm.json. Sin valor, Compose se detiene:
      # un marcador sin resolver quedaría como texto literal en el secret.
      KC_CHAT_API_SECRET: ${KC_CHAT_API_SECRET:?define KC_CHAT_API_SECRET en infra/keycloak/.env}
      FINANZAS_AGENT_CLIENT_SECRET: ${FINANZAS_AGENT_CLIENT_SECRET:?define FINANZAS_AGENT_CLIENT_SECRET en infra/keycloak/.env}
      KC_ANA_PASSWORD: ${KC_ANA_PASSWORD:?define KC_ANA_PASSWORD en infra/keycloak/.env}
      KC_BETO_PASSWORD: ${KC_BETO_PASSWORD:?define KC_BETO_PASSWORD en infra/keycloak/.env}
      KC_LAB_ADMIN_PASSWORD: ${KC_LAB_ADMIN_PASSWORD:?define KC_LAB_ADMIN_PASSWORD en infra/keycloak/.env}
    volumes:
      - ./import:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  keycloak-pgdata:
