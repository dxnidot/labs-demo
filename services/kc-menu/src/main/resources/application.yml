spring:
  application:
    name: kc-menu
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/lab}
server:
  port: 8081
menu:
  opciones:
    - clave: resumen
      titulo: "Resumen"
      ruta: /resumen
      rol: ver-menu
      acciones:
        - clave: consultar
          rol: ver-menu
    - clave: autorizaciones
      titulo: "Bandeja de autorizaciones"
      ruta: /autorizaciones
      rol: autorizar
      acciones:
        - clave: aprobar
          rol: autorizar
    - clave: administracion
      titulo: "Administración de seguridad"
      ruta: /admin
      rol: admin-seguridad
